<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f2d5c">
<title>全球金融盘面台</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#131a26; --ink2:#5b6779; --ink3:#8b97a8;
  --line:#e4e9f0; --line2:#eef2f7;
  --brand:#0f2d5c; --brand2:#1e5bbf; --brand-soft:#eaf1fd;
  --up:#e0342a; --down:#0e9e63; --flat:#8b97a8;
  --hi:#e0342a; --hi-bg:#fdecea; --mid:#e08700; --mid-bg:#fff5e6; --low:#5b6779; --low-bg:#f1f4f8;
  --r:14px; --r2:10px;
  --sh:0 1px 2px rgba(16,32,64,.05), 0 6px 18px rgba(16,32,64,.05);
}
body.inv{ --up:#0e9e63; --down:#e0342a; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(68px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
.hide{display:none !important}

/* ---------- Header ---------- */
.hd{background:linear-gradient(135deg,#0f2d5c,#1a4a8f 58%,#1e5bbf);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 0 14px}
.hd-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.logo svg{flex:none}
.logo h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.3px;white-space:nowrap}
.logo .sub{font-size:11px;opacity:.72;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:7px;flex-wrap:wrap}
.hb{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);color:#fff;
  border:1px solid rgba(255,255,255,.2);padding:0 11px;height:36px;border-radius:9px;font-size:13px;font-weight:520;white-space:nowrap}
.hb:active{background:rgba(255,255,255,.28)}
.hb svg{flex:none}
.hb.primary{background:#fff;color:var(--brand);border-color:#fff;font-weight:620}

/* ---------- Sync bar ---------- */
.syncbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:7px 11px;margin-top:11px;color:rgba(255,255,255,.9)}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;flex:none;box-shadow:0 0 0 3px rgba(74,222,128,.22)}
.dot.warn{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.22)}
.dot.err{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.22)}
.dot.live{animation:pulse 1.9s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.syncbar .sep{opacity:.3}

/* ---------- Today panel ---------- */
.today{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-top:14px;overflow:hidden;border:1px solid var(--line)}
.today-hd{display:flex;align-items:center;gap:8px;padding:13px 15px 11px;border-bottom:1px solid var(--line2)}
.today-hd h2{margin:0;font-size:15px;font-weight:650;letter-spacing:.2px}
.badge{background:var(--hi);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;min-width:20px;text-align:center}
.badge.zero{background:var(--down)}
.today-list{padding:5px 8px 9px}
.ti{display:flex;align-items:flex-start;gap:10px;padding:10px 8px;border-radius:var(--r2)}
.ti+.ti{border-top:1px solid var(--line2)}
.ti-ic{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ti-ic.hi{background:var(--hi-bg);color:var(--hi)} .ti-ic.mid{background:var(--mid-bg);color:var(--mid)} .ti-ic.low{background:var(--low-bg);color:var(--low)}
.ti-b{flex:1;min-width:0}
.ti-t{font-size:14px;font-weight:560;line-height:1.4}
.ti-m{font-size:12px;color:var(--ink3);margin-top:2px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.ti-act{flex:none;height:32px;padding:0 12px;border-radius:8px;background:var(--brand-soft);color:var(--brand2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.ti-act:active{background:#d8e5fb}
.ti.over .ti-t{color:var(--hi)}
.empty{padding:26px 14px;text-align:center;color:var(--ink3);font-size:13.5px}
.empty svg{display:block;margin:0 auto 8px;opacity:.4}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:6px;margin:16px 0 12px;background:#e8edf5;padding:4px;border-radius:12px}
.tab{flex:1;height:40px;border-radius:9px;font-size:14px;font-weight:580;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px}
.tab.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(16,32,64,.1)}
.tab svg{flex:none}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.card-hd{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card-hd h3{margin:0;font-size:14.5px;font-weight:640;display:flex;align-items:center;gap:7px}
.card-hd .grow{margin-left:auto}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:5px;background:var(--low-bg);color:var(--ink2)}
.pill.live{background:#e7f7ef;color:#0e9e63;display:inline-flex;align-items:center;gap:4px}
.pill.live::before{content:"";width:5px;height:5px;border-radius:50%;background:#0e9e63;animation:pulse 1.9s infinite}
.pill.brief{background:var(--brand-soft);color:var(--brand2)}
.pill.cache{background:var(--mid-bg);color:var(--mid)}

/* ---------- Quote table ---------- */
.qt{width:100%;border-collapse:collapse}
.qt th{font-size:11.5px;font-weight:600;color:var(--ink3);text-align:right;padding:8px 15px;background:#fafbfd;border-bottom:1px solid var(--line2);white-space:nowrap}
.qt th:first-child{text-align:left}
.qt td{padding:10px 15px;border-bottom:1px solid var(--line2);text-align:right;font-size:14px;white-space:nowrap}
.qt tr:last-child td{border-bottom:none}
.qt td:first-child{text-align:left}
.qn{font-weight:560;font-size:14px}
.qc{font-size:11px;color:var(--ink3);margin-top:1px;font-variant-numeric:tabular-nums}
.qp{font-variant-numeric:tabular-nums;font-weight:600}
.qg{font-variant-numeric:tabular-nums;font-weight:650;font-size:13.5px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.spark{vertical-align:middle}
.qt tr.rowsel{background:#fafcff}

/* ---------- News ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:11px 15px;border-bottom:1px solid var(--line2);background:#fafbfd}
.fbtn{height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:540;background:#fff;border:1px solid var(--line);color:var(--ink2)}
.fbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.nlist{padding:4px 0}
.ni{display:flex;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line2);align-items:flex-start}
.ni:last-child{border-bottom:none}
.ni.done{opacity:.5}
.ni.done .ni-t{text-decoration:line-through}
.lv{flex:none;width:3px;align-self:stretch;border-radius:3px;min-height:38px}
.lv.high{background:var(--hi)} .lv.mid{background:var(--mid)} .lv.low{background:#c3cbd8}
.ni-b{flex:1;min-width:0}
.ni-t{font-size:14.5px;font-weight:540;line-height:1.45;word-break:break-word}
.ni-m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px;font-size:11.5px;color:var(--ink3)}
.tag{background:var(--brand-soft);color:var(--brand2);padding:1.5px 7px;border-radius:5px;font-size:11px;font-weight:560}
.lvtag{padding:1.5px 7px;border-radius:5px;font-size:11px;font-weight:680}
.lvtag.high{background:var(--hi-bg);color:var(--hi)} .lvtag.mid{background:var(--mid-bg);color:var(--mid)} .lvtag.low{background:var(--low-bg);color:var(--low)}
.ni-a{flex:none;display:flex;flex-direction:column;gap:5px}
.mini{width:44px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#f1f4f8;color:var(--ink2)}
.mini:active{background:#e2e8f0}
.mini.ok{background:#e7f7ef;color:var(--down)}
.mini.del:active{background:var(--hi-bg);color:var(--hi)}

/* ---------- Review ---------- */
.rv-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.rv-col{padding:0}
.rv-col+.rv-col{border-left:1px solid var(--line2)}
.rv-h{display:flex;align-items:center;gap:7px;padding:11px 15px 9px;font-size:13.5px;font-weight:650;border-bottom:1px solid var(--line2)}
.rv-h.opp{color:var(--down)} .rv-h.risk{color:var(--hi)}
.rv-h .grow{margin-left:auto}
.addmini{width:28px;height:28px;border-radius:7px;background:#f1f4f8;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.addmini:active{background:#e2e8f0}
.rli{display:flex;gap:9px;align-items:flex-start;padding:9px 15px;border-bottom:1px solid var(--line2);font-size:14px;line-height:1.45}
.rli:last-child{border-bottom:none}
.ck{flex:none;width:19px;height:19px;border-radius:6px;border:1.8px solid #c3cbd8;margin-top:2px;display:flex;align-items:center;justify-content:center;background:#fff}
.ck.on{background:var(--down);border-color:var(--down);color:#fff}
.rli.on span.txt{text-decoration:line-through;color:var(--ink3)}
.rli .txt{flex:1;word-break:break-word}
.rli .x{flex:none;color:var(--ink3);width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.note{width:100%;border:none;padding:12px 15px;resize:vertical;min-height:92px;font-size:15px;line-height:1.6;background:#fff;outline:none;display:block}
.note::placeholder{color:var(--ink3)}
.hist{padding:0}
.hi-row{padding:11px 15px;border-bottom:1px solid var(--line2)}
.hi-row:last-child{border-bottom:none}
.hi-d{font-size:12.5px;font-weight:650;color:var(--brand2);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.hi-s{font-size:13px;color:var(--ink2);line-height:1.5}
.cnt{font-size:11px;font-weight:600;color:var(--ink3);background:#f1f4f8;padding:1px 6px;border-radius:5px}

/* ---------- Modal ---------- */
.mask{position:fixed;inset:0;background:rgba(13,22,40,.5);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.m-hd{display:flex;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:#fff;z-index:2}
.m-hd h3{margin:0;font-size:16px;font-weight:650}
.m-hd .x{margin-left:auto;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink2);background:#f1f4f8}
.m-bd{padding:15px 17px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;outline:none}
.fld textarea{height:auto;min-height:88px;padding:11px 12px;resize:vertical;line-height:1.55;font-size:15px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand2)}
.seg{display:flex;gap:7px}
.seg button{flex:1;height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:560;color:var(--ink2)}
.seg button.on{border-color:var(--brand2);background:var(--brand-soft);color:var(--brand2);font-weight:680}
.seg button.on.hi{border-color:var(--hi);background:var(--hi-bg);color:var(--hi)}
.seg button.on.md{border-color:var(--mid);background:var(--mid-bg);color:var(--mid)}
.m-ft{display:flex;gap:9px;padding:13px 17px calc(15px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);position:sticky;bottom:0;background:#fff}
.btn{flex:1;height:48px;border-radius:11px;font-size:15px;font-weight:620;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:active{background:#0a2148}
.btn.gh{background:#f1f4f8;color:var(--ink2)}
.btn.dg{background:var(--hi);color:#fff}
.hintbox{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:12.5px;color:var(--ink2);line-height:1.6;margin-bottom:13px}
.hintbox b{color:var(--ink)}
.hintbox code{background:#eef2f7;padding:1px 5px;border-radius:4px;font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#131a26;color:#fff;
  padding:11px 18px;border-radius:11px;font-size:14px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* ---------- Backup nudge ---------- */
.nudge{display:flex;align-items:center;gap:9px;background:var(--mid-bg);border:1px solid #f5dfb0;color:#8a5b00;
  border-radius:11px;padding:10px 13px;font-size:13px;margin-top:14px}
.nudge button{margin-left:auto;flex:none;background:#8a5b00;color:#fff;height:32px;padding:0 13px;border-radius:8px;font-size:12.5px;font-weight:620}

/* ---------- Bottom tabbar (mobile) ---------- */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:80;background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{display:flex}
.tb{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--ink3);font-weight:560}
.tb.on{color:var(--brand2)}
.tb .n{position:relative}
.tb .bdg{position:absolute;top:-3px;right:-9px;background:var(--hi);color:#fff;font-size:9px;font-weight:700;border-radius:9px;padding:0 4px;min-width:14px;height:14px;line-height:14px;text-align:center}

.foot{text-align:center;font-size:11.5px;color:var(--ink3);padding:8px 0 24px;line-height:1.7}

/* ---------- K 线弹窗 ---------- */
.kl-info{font-size:13px;color:var(--ink2);margin-bottom:10px;line-height:1.5}
.kl-info b{color:var(--ink)}
.kl-canvas{background:#fff;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;min-height:320px}
.kl-canvas svg{display:block;touch-action:none}
.kl-bar{display:flex;align-items:center;gap:8px;margin-top:11px}
.kl-btn{flex:none;height:38px;padding:0 12px;border-radius:9px;background:#f1f4f8;color:var(--ink2);font-size:13.5px;font-weight:560}
.kl-btn:active{background:#e2e8f0}
.kl-bar input[type=range]{accent-color:var(--brand2);height:38px;flex:1}
.kl-hint{font-size:11.5px;color:var(--ink3);margin-top:8px;line-height:1.5}

/* ---------- 中国恐慌指数 ---------- */
.fear-card{background:linear-gradient(180deg,#fff,#fbfdff)}
.fear-card .card-hd h3{color:var(--hi)}
.fear-row{display:flex;align-items:center;gap:16px;padding:14px 15px}
.fear-side{flex:1;min-width:0}
.fear-cap{font-size:13px;color:var(--ink2);line-height:1.55}
.fear-spark{margin:8px 0 2px}
.fear-tip{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.5}

/* ---------- 板块市场卡（亚太 / 欧美） ---------- */
.card.mkt.focus{border-color:var(--brand2);box-shadow:0 0 0 2px var(--brand-soft),var(--sh)}
.mkt-flow{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;background:#fafbfd;border-bottom:1px solid var(--line2);font-size:13.5px;color:var(--ink2)}
.mkt-flow b{font-size:15px;font-variant-numeric:tabular-nums}
.sec-list{padding:4px 0}
.sec{padding:11px 15px;border-bottom:1px solid var(--line2)}
.sec:last-child{border-bottom:none}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600}
.sec-h span:first-child{color:var(--ink)}
.sec-chg{font-variant-numeric:tabular-nums;font-weight:650;font-size:13px}
.sec-flow{font-size:11.5px;color:var(--ink3);margin-top:3px}
.sec-ld{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.ld{background:#f1f4f8;border-radius:7px;padding:2px 8px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ld i{font-style:normal;font-weight:600;margin-left:3px}
.mkt-note{padding:11px 15px;font-size:12.5px;color:var(--ink3);line-height:1.55;border-top:1px solid var(--line2)}

/* 数据日期条 + 新鲜度 */
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;font-size:12px}
.datebar .pill{margin:0}
.pill.today{background:#e7f7ef;color:#0e9e63;border:1px solid #b6e8d2}
.pill.stale{background:#fff4e6;color:#e08700;border:1px solid #ffd9a8}
.db-d{font-weight:700;color:var(--ink)}
.db-n{color:var(--ink3)}
.mkt-date{margin-left:auto;font-size:11px;color:var(--ink3);font-weight:500;padding:2px 8px;border:1px solid var(--line2);border-radius:20px;background:#fafbfd}

/* ---------- Responsive ---------- */
@media (max-width:860px){
  .rv-grid{grid-template-columns:1fr}
  .rv-col+.rv-col{border-left:none;border-top:1px solid var(--line2)}
}
@media (max-width:768px){
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .wrap{padding:0 11px}
  .logo h1{font-size:16.5px}
  .hbtns .lbl{display:none}
  .hb{padding:0 10px;min-width:44px;justify-content:center}
  .hb.primary .lbl{display:inline}
  .tabs{display:none}
  .tabbar{display:block}
  .qt th:nth-child(2),.qt td:nth-child(2){display:none}      /* hide sparkline col */
  .qt th,.qt td{padding:10px 11px}
  .qt td:first-child{max-width:44vw;white-space:normal}
  .ti-act{padding:0 10px;font-size:12.5px}
  .m-ft .btn{height:50px}
}
@media (max-width:400px){
  .qt th:nth-child(3),.qt td:nth-child(3){font-size:13px}
  .hb{height:38px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal-root"></div>

<script>
/* ===================================================================
   全球金融盘面台  Global Markets Desk
   单文件 · 零外链 · localStorage 持久化
   =================================================================== */
"use strict";

/* ---------- 1. 内联 SVG 图标 ---------- */
const I = {

/* ---------- 2. 工具函数 ---------- */
const $  = s => document.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const todayStr = ()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const nowTs = ()=>Date.now();
function fmtDT(ts){const d=new Date(ts);return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function fmtT(ts){const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function ago(ts){
  const s=(nowTs()-ts)/1000;
  if(s<60) return '刚刚';
  if(s<3600) return Math.floor(s/60)+' 分钟前';
  if(s<86400) return Math.floor(s/3600)+' 小时前';
  return Math.floor(s/86400)+' 天前';
}
function num(v,d){
  if(v==null||isNaN(v)) return '—';
  const n=Number(v);
  if(d==null) d = Math.abs(n)>=1000?2 : Math.abs(n)>=10?2 : Math.abs(n)>=1?4 : 6;
  return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function pct(v){
  if(v==null||isNaN(v)) return '—';
  const n=Number(v);
  return (n>0?'+':'')+n.toFixed(2)+'%';
}
function cls(v){ if(v==null||isNaN(v)||Number(v)===0) return 'flat'; return Number(v)>0?'up':'down'; }
function toast(msg,ms){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'), ms||2100);
}

/* 手写内联 SVG 迷你走势线 */
function spark(arr,color,w,h){
  w=w||74; h=h||24;
  if(!arr||arr.length<2) return `<svg class="spark" width="${w}" height="${h}"></svg>`;
  const mn=Math.min(...arr), mx=Math.max(...arr), rg=(mx-mn)||1;
  const pts=arr.map((v,i)=>[ (i/(arr.length-1))*(w-2)+1, h-2-((v-mn)/rg)*(h-5) ]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L${pts[pts.length-1][0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z`;
  const id='g'+uid();
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".22"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function upColor(v){
  const inv=document.body.classList.contains('inv');
  if(v==null||isNaN(v)||Number(v)===0) return '#8b97a8';
  const isUp=Number(v)>0;
  return (isUp!==inv)?'#e0342a':'#0e9e63';
}

   5. 实时数据层 —— 多源降级
   汇率 / 数字货币：公开免费接口，无需 Key，支持跨域
   全部失败 → 回落到 localStorage 缓存，并明示"缓存"状态，绝不白屏
   =================================================================== */
async function tryFetch(url, ms){
  const ctrl = new AbortController();
  const tm = setTimeout(()=>ctrl.abort(), ms||9000);
  try{
    const r = await fetch(url, {signal:ctrl.signal, cache:'no-store', mode:'cors'});
    clearTimeout(tm);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){ clearTimeout(tm); throw e; }
}

/* --- 汇率：展示的货币对 --- */
const FX_PAIRS = [
  {c:'USDCNY', n:'美元 / 离岸人民币', k:'CNY',  inv:false, d:4},
  {c:'EURUSD', n:'欧元 / 美元',       k:'EUR',  inv:true,  d:4},
  {c:'USDJPY', n:'美元 / 日元',       k:'JPY',  inv:false, d:2},
  {c:'GBPUSD', n:'英镑 / 美元',       k:'GBP',  inv:true,  d:4},
  {c:'AUDUSD', n:'澳元 / 美元',       k:'AUD',  inv:true,  d:4},
  {c:'USDCHF', n:'美元 / 瑞郎',       k:'CHF',  inv:false, d:4},
  {c:'USDCAD', n:'美元 / 加元',       k:'CAD',  inv:false, d:4},
  {c:'USDHKD', n:'美元 / 港元',       k:'HKD',  inv:false, d:4}
];

function buildFx(rates, prevRates){
  const out=[];
  for(const p of FX_PAIRS){
    const r = rates[p.k]; if(r==null) continue;
    const price = p.inv ? 1/r : r;
    let g = null;
    if(prevRates && prevRates[p.k]!=null){
      const pv = p.inv ? 1/prevRates[p.k] : prevRates[p.k];
      if(pv) g = (price-pv)/pv*100;
    }
    out.push({c:p.c, n:p.n, p:price, g:g, d:p.d});
  }
  return out;
}

async function fetchFX(){
  /* 源 1：frankfurter（欧洲央行）— 可同时取昨日，能算出真实日涨跌 */
  try{
    const syms='CNY,EUR,JPY,GBP,AUD,CHF,CAD,HKD';
    const [cur, prev] = await Promise.all([
      tryFetch(`https://api.frankfurter.app/latest?from=USD&to=${syms}`),
      tryFetch(`https://api.frankfurter.app/${ydayStr(4)}..?from=USD&to=${syms}`).catch(()=>null)
    ]);
    if(cur && cur.rates){
      let prevRates=null;
      if(prev && prev.rates){
        const days=Object.keys(prev.rates).sort();
        if(days.length>=2) prevRates = prev.rates[days[days.length-2]];
      }
      const list=buildFx(cur.rates, prevRates);
      if(list.length) return {ok:true, list, src:'ECB / frankfurter', asOf:cur.date};
    }
  }catch(e){}

  /* 源 2：open.er-api —— 用本地上次值算变化 */
  try{
    const j = await tryFetch('https://open.er-api.com/v6/latest/USD');
    if(j && j.rates){
      const cached = (DB.markets.fxRaw)||null;
      const list = buildFx(j.rates, cached);
      if(list.length){
        DB.markets.fxRaw = j.rates;
        return {ok:true, list, src:'open.er-api', asOf:(j.time_last_update_utc||'').slice(5,16)};
      }
    }
  }catch(e){}

  /* 源 3：currency-api 镜像 */
  for(const u of ['https://latest.currency-api.pages.dev/v1/currencies/usd.json',
                  'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json']){
    try{
      const j = await tryFetch(u);
      const raw = j && j.usd;
      if(raw){
        const rates={}; for(const p of FX_PAIRS){ if(raw[p.k.toLowerCase()]!=null) rates[p.k]=raw[p.k.toLowerCase()]; }
        const list = buildFx(rates, DB.markets.fxRaw||null);
        if(list.length){ DB.markets.fxRaw = rates; return {ok:true, list, src:'currency-api', asOf:j.date||''}; }
      }
    }catch(e){}
  }
  return {ok:false};
}

const CRYPTO = [
  {sym:'BTC', n:'比特币',    cg:'bitcoin',     cc:'bitcoin',      bn:'BTCUSDT'},
  {sym:'ETH', n:'以太坊',    cg:'ethereum',    cc:'ethereum',     bn:'ETHUSDT'},
  {sym:'SOL', n:'Solana',    cg:'solana',      cc:'solana',       bn:'SOLUSDT'},
  {sym:'BNB', n:'BNB',       cg:'binancecoin', cc:'binance-coin', bn:'BNBUSDT'},
  {sym:'XRP', n:'瑞波币',    cg:'ripple',      cc:'xrp',          bn:'XRPUSDT'},
  {sym:'DOGE',n:'狗狗币',    cg:'dogecoin',    cc:'dogecoin',     bn:'DOGEUSDT'}
];

async function fetchCrypto(){
  /* 源 1：CoinGecko */
  try{
    const ids=CRYPTO.map(c=>c.cg).join(',');
    const j=await tryFetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`);
    const list=[];
    for(const c of CRYPTO){ const d=j&&j[c.cg]; if(d&&d.usd!=null) list.push({c:c.sym,n:c.n,p:d.usd,g:d.usd_24h_change}); }
    if(list.length>=3) return {ok:true, list, src:'CoinGecko'};
  }catch(e){}

  /* 源 2：CoinCap */
  try{
    const j=await tryFetch('https://api.coincap.io/v2/assets?limit=100');
    const map={}; (j.data||[]).forEach(a=>map[a.id]=a);
    const list=[];
    for(const c of CRYPTO){ const d=map[c.cc]; if(d) list.push({c:c.sym,n:c.n,p:+d.priceUsd,g:+d.changePercent24Hr}); }
    if(list.length>=3) return {ok:true, list, src:'CoinCap'};
  }catch(e){}

  /* 源 3：Binance 公共行情 */
  for(const host of ['https://data-api.binance.vision','https://api.binance.com']){
    try{
      const syms=encodeURIComponent(JSON.stringify(CRYPTO.map(c=>c.bn)));
      const j=await tryFetch(`${host}/api/v3/ticker/24hr?symbols=${syms}`);
      const map={}; (j||[]).forEach(a=>map[a.symbol]=a);
      const list=[];
      for(const c of CRYPTO){ const d=map[c.bn]; if(d) list.push({c:c.sym,n:c.n,p:+d.lastPrice,g:+d.priceChangePercent}); }
      if(list.length>=3) return {ok:true, list, src:'Binance'};
    }catch(e){}
  }
  return {ok:false};
}

let SYNC = {state:'idle', fx:'', cr:'', at:0, err:0, briefAt:0};

async function refreshLive(silent){
  if(SYNC.state==='loading') return;
  SYNC.state='loading'; renderSync();
  if(!silent) toast('正在拉取实时行情…');

  const [fx, cr] = await Promise.all([fetchFX(), fetchCrypto()]);
  let okCount=0;

  if(fx.ok){
    DB.markets.fx = fx.list; DB.markets.srcFx = fx.src; DB.markets.tFx = nowTs();
    SYNC.fx = fx.src; okCount++;
  } else SYNC.fx = '';

  if(cr.ok){
    DB.markets.crypto = cr.list; DB.markets.srcCr = cr.src; DB.markets.tCr = nowTs();
    SYNC.cr = cr.src; okCount++;
  } else SYNC.cr = '';

  SYNC.at = nowTs();
  SYNC.state = okCount===2 ? 'ok' : okCount===1 ? 'partial' : 'fail';
  persist('mk');
  render();

  if(!silent){
    if(okCount===2) toast('实时行情已更新');
    else if(okCount===1) toast('部分数据源不可达，已用缓存补齐');
    else toast('实时源全部不可达，显示的是本地缓存数据', 3200);
  }
}

   6. 「今天要处理」计算
   =================================================================== */
function todayItems(){
  const items=[];
  const today=todayStr();

  /* a. 高敏感要闻未处理（>12 小时未处理 = 逾期） */
  DB.news.filter(n=>!n.done && n.level==='high')
    .sort((a,b)=>a.ts-b.ts)
    .forEach(n=>{
      const overdue = (nowTs()-n.ts) > 12*3600*1000;
      items.push({k:'news', over:overdue, ic:'hi', icon:I.alert,
        t:n.title, m:[(overdue?'已积压 ':'')+ago(n.ts), '高敏感', n.tags.slice(0,3).join(' · ')],
        act:'标记已读', fn:()=>{n.done=true;persist('nw');render();toast('已处理');}});
    });

  /* b. 今日复盘未写 */
  const rv = DB.reviews.find(r=>r.date===today);
  if(!rv || (!rv.note && !rv.opps.length && !rv.risks.length)){
    items.push({k:'rv', over:false, ic:'mid', icon:I.book,
      t:'今日复盘尚未记录', m:['机会 / 风险 / 盘面小结'],
      act:'去写', fn:()=>{go('review');}});
  }

  /* c. 昨日未完成的机会 / 风险 —— 自动顺延到今天 */
  const past = DB.reviews.filter(r=>r.date<today).sort((a,b)=>b.date.localeCompare(a.date));
  const carried=[];
  past.slice(0,4).forEach(r=>{
    r.risks.filter(x=>!x.done).forEach(x=>carried.push({r,x,type:'risk',d:r.date}));
    r.opps.filter(x=>!x.done).forEach(x=>carried.push({r,x,type:'opp',d:r.date}));
  });
  carried.slice(0,5).forEach(c=>{
    const days=Math.round((new Date(today)-new Date(c.d))/86400000);
    items.push({k:'carry', over:days>=2, ic:c.type==='risk'?'hi':'low',
      icon:c.type==='risk'?I.alert:I.up,
      t:c.x.t, m:[(c.type==='risk'?'风险跟进':'机会跟进'), `${c.d} 顺延`+(days>=2?`（${days} 天未处理）`:'')],
      act:'完成', fn:()=>{c.x.done=true;persist('rv');render();toast('已勾除');}});
  });

  /* d. 行情数据陈旧 */
  const tFx = DB.markets.tFx||0;
  if(nowTs()-tFx > 30*60*1000){
    items.push({k:'sync', over:false, ic:'low', icon:I.refresh,
      t:'实时行情已超过 30 分钟未刷新', m:[tFx?ago(tFx)+'更新':'尚未拉取过'],
      act:'刷新', fn:()=>refreshLive(false)});
  }

  /* e. 简报数据未同步 */
  if(DB.meta.lastBrief !== today){
    items.push({k:'brief', over:false, ic:'low', icon:I.inbox,
      t:'今日简报数据尚未同步（股指 / 大宗 / 亚太 / 欧美）', m:[DB.meta.lastBrief?('上次同步 '+DB.meta.lastBrief):'从未同步', '点「同步简报」或刷新页面自动拉取'],
      act:'同步', fn:()=>fetchBrief(false)});
  }
  return items;
}

function renderSync(){
  const n=$('#syncbar'); if(!n) return;
  const s=SYNC.state;
  const dot = s==='loading'?'<span class="dot warn live"></span>'
            : s==='ok'?'<span class="dot live"></span>'
            : s==='partial'?'<span class="dot warn"></span>'
            : s==='fail'?'<span class="dot err"></span>'
            : '<span class="dot warn"></span>';
  let txt;
  if(s==='loading') txt='正在拉取实时行情…';
  else if(s==='ok') txt=`实时源正常 · 汇率 ${SYNC.fx} · 加密 ${SYNC.cr}`;
  else if(s==='partial') txt=`部分源可达（${SYNC.fx||SYNC.cr}），其余显示缓存`;
  else if(s==='fail') txt='实时源不可达，当前为本地缓存数据';
  else txt='等待首次拉取';
  const t = DB.markets.tFx||DB.markets.tCr;
  n.innerHTML = `${dot}<span>${esc(txt)}</span>`
    + (t?`<span class="sep">|</span><span>行情 ${ago(t)}</span>`:'')
    + `<span class="sep">|</span><span>简报 ${DB.meta.lastBrief||'未导入'}</span>`
    + (SYNC.briefAt?`<span class="sep">|</span><span>同步 ${ago(SYNC.briefAt)}</span>`:'')
    + `<span class="sep">|</span><span>亚太 ${DB.markets.asia.date||'示例'}</span>`
    + `<span class="sep">|</span><span>欧美 ${DB.markets.europe.date||'示例'}</span>`;
}

function qtRows(list, opt){
  opt=opt||{};

  return list.map(q=>{
    const c=cls(q.g), col=upColor(q.g);
    const sp = q.s&&q.s.length? spark(q.s,col) : `<svg class="spark" width="74" height="24"></svg>`;
    const sub = q.u ? q.u : (q.r? q.r : q.c);
    const kattr = opt.cls ? ` data-act="kline" data-cls="${opt.cls}" data-key="${esc(q.c)}" title="点击查看 K 线走势图"` : '';
    return `<tr>
      <td><div class="qn klink"${kattr}>${esc(q.n)}</div><div class="qc">${esc(sub)}</div></td>
      <td>${sp}</td>
      <td class="qp">${num(q.p, q.d)}</td>
      <td class="qg ${c}">${pct(q.g)}</td>
    </tr>`;
  }).join('');
}

async function fetchKline(cls, key){
  if(cls==='crypto'){
    const c=CRYPTO.find(x=>x.sym===key);
    if(c){
      for(const host of ['https://api.binance.com','https://data-api.binance.vision']){
        try{
          const j=await tryFetch(`${host}/api/v3/klines?symbol=${c.bn}&interval=1d&limit=160`);
          if(Array.isArray(j)&&j.length){
            const pts=j.map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}));
            return {ok:true, mode:'candle', pts, src:'Binance · 日K', sym:c.sym};
          }
        }catch(e){}
      }
      try{
        const j=await tryFetch(`https://api.coingecko.com/api/v3/coins/${c.cg}/market_chart?vs_currency=usd&days=160`);
        if(j&&j.prices&&j.prices.length){
          const pts=j.prices.map(p=>({t:p[0],o:p[1],h:p[1],l:p[1],c:p[1],v:0}));
          return {ok:true, mode:'line', pts, src:'CoinGecko · 日线', sym:c.sym};
        }
      }catch(e){}
    }
  }
  if(cls==='fx'){
    const base=key.slice(0,3), quote=key.slice(3);
    try{
      const j=await tryFetch(`https://api.frankfurter.app/${ydayStr(360)}..?from=${base}&to=${quote}`);
      if(j&&j.rates){
        const days=Object.keys(j.rates).sort();
        if(days.length){
          const pts=days.map(d=>{ const o=j.rates[d]; const val=o[quote]!=null?o[quote]:o[Object.keys(o)[0]]; return {t:Date.parse(d),o:val,h:val,l:val,c:val,v:0}; });
          return {ok:true, mode:'line', pts, src:'frankfurter · 日线', sym:`${base}/${quote}`};
        }
      }
    }catch(e){}
  }
  if(cls==='index'||cls==='cmd'){
    const arr=(cls==='index'?DB.markets.indices:DB.markets.commodities).find(x=>x.c===key);
    if(arr&&arr.s&&arr.s.length){
      const n=arr.s.length;
      const pts=arr.s.map((v,i)=>({t:nowTs()-(n-1-i)*86400000,o:v,h:v,l:v,c:v,v:0}));
      return {ok:true, mode:'line', pts, src:(arr.s.length>40?'简报日线序列':'走势近似'), sym:arr.n};
    }
  }
  const cache=DB.markets.kcache[cls+':'+key];
  if(cache&&cache.length) return {ok:true, mode:cache[0].o!=null?'candle':'line', pts:cache, src:'本地缓存', sym:key};
  return {ok:false};
}

let KL={};
function renderKline(){
  const box=$('#kl-canvas'); if(!box) return;
  const {pts, mode, show, offset}=KL;
  if(!pts||!pts.length){ box.innerHTML='<div class="empty">暂无可用数据</div>'; return; }
  const W=Math.max(320, box.clientWidth||720), H=320, n=pts.length;
  const cnt=Math.min(show, n);
  let start=Math.max(0, n-cnt-offset), end=Math.min(n, n-offset);
  if(end<=start) end=start+1;
  const view=pts.slice(start,end);
  let hi=-1e30, lo=1e30;
  view.forEach(p=>{ const a=mode==='candle'?p.h:p.c, b=mode==='candle'?p.l:p.c; if(a>hi)hi=a; if(b<lo)lo=b; });
  if(hi===lo){hi+=1;lo-=1;}
  const pad=(hi-lo)*0.08; hi+=pad; lo-=pad;
  const X=i=> view.length<=1?W/2 : 40 + i*(W-56)/(view.length-1);
  const Y=v=> H-34 - (v-lo)/(hi-lo)*(H-66);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block">`;
  for(let g=0;g<=4;g++){ const yy=H-34-g*(H-66)/4; const val=lo+(hi-lo)*g/4;
    svg+=`<line x1="40" y1="${yy}" x2="${W-16}" y2="${yy}" stroke="#eef2f7"/>`;
    svg+=`<text x="${W-12}" y="${yy+4}" text-anchor="end" font-size="10" fill="#8b97a8">${num(val, val<10?3:2)}</text>`; }
  if(mode==='candle'){
    const bw=Math.max(2,(W-56)/view.length*0.62);
    view.forEach((p,i)=>{ const cx=X(i), up=p.c>=p.o, c=up?'#e0342a':'#0e9e63';
      svg+=`<line x1="${cx}" y1="${Y(p.h)}" x2="${cx}" y2="${Y(p.l)}" stroke="${c}" stroke-width="1"/>`;
      svg+=`<rect x="${cx-bw/2}" y="${Y(Math.max(p.o,p.c))}" width="${bw}" height="${Math.max(1,Math.abs(Y(p.o)-Y(p.c)))}" fill="${c}"/>`; });
  }else{
    let d=''; view.forEach((p,i)=>{ d+=(i?'L':'M')+X(i)+' '+Y(p.c)+' '; });
    const area=`M40 ${H-34} `+view.map((p,i)=>'L'+X(i)+' '+Y(p.c)).join(' ')+` L${X(view.length-1)} ${H-34} Z`;
    const lc=upColor(pts[n-1].c-pts[0].c);
    svg+=`<path d="${area}" fill="${lc}" opacity="0.10"/>`;
    svg+=`<path d="${d}" fill="none" stroke="${lc}" stroke-width="1.6"/>`;
    const last=view[view.length-1];
    svg+=`<circle cx="${X(view.length-1)}" cy="${Y(last.c)}" r="3" fill="${lc}"/>`;
  }
  const step=Math.max(1,Math.floor(view.length/5));
  for(let i=0;i<view.length;i+=step){ const dt=new Date(view[i].t); const lbl=`${dt.getMonth()+1}/${dt.getDate()}`;
    svg+=`<text x="${X(i)}" y="${H-14}" text-anchor="middle" font-size="9.5" fill="#8b97a8">${lbl}</text>`; }
  svg+=`</svg>`;
  box.innerHTML=svg;
}

async function openKline(cls, key){
  const meta = cls==='crypto'?CRYPTO.find(c=>c.sym===key)
            : cls==='fx'?(FX_PAIRS.find(p=>p.c===key)||{})
            : (DB.markets.indices.find(x=>x.c===key)||DB.markets.commodities.find(x=>x.c===key)||{});
  const title = (meta&&meta.n)?meta.n:key;
  modal('K 线走势 · '+title, `
    <div id="kl-info" class="kl-info">正在拉取 ${esc(title)} 的走势数据…</div>
    <div id="kl-canvas" class="kl-canvas"></div>
    <div class="kl-bar">
      <button class="kl-btn" data-act="klpan" data-d="-1">← 更早</button>
      <input type="range" id="kl-range" min="15" max="160" value="80" style="flex:1">
      <button class="kl-btn" data-act="klpan" data-d="1">更新 →</button>
    </div>
    <div class="kl-hint">桌面：鼠标滚轮缩放、按住拖动平移 · 移动端：用滑块缩放、按钮平移</div>
  `);
  const box=$('#kl-canvas');
  KL={pts:[], mode:'line', show:80, offset:0};
  box.addEventListener('wheel', e=>{
    e.preventDefault();
    const rect=box.getBoundingClientRect(); const px=(e.clientX-rect.left)/rect.width;
    const n=KL.pts.length; if(!n) return;
    const delta=e.deltaY<0 ? -Math.max(5,Math.round(KL.show*0.18)) : Math.max(5,Math.round(KL.show*0.18));
    KL.show=Math.min(160, Math.max(15, KL.show+delta));
    const r=$('#kl-range'); if(r) r.value=KL.show;
    renderKline();
  }, {passive:false});
  let drag=null;
  box.addEventListener('mousedown', e=>{ drag={x:e.clientX, off:KL.offset}; });
  box.addEventListener('mousemove', e=>{ if(!drag) return; const rect=box.getBoundingClientRect(); const dx=(e.clientX-drag.x)/rect.width; const n=KL.pts.length; const step=Math.round(dx*n/2); KL.offset=Math.max(0, Math.min(n-KL.show, drag.off-Math.round(step))); renderKline(); });
  box.addEventListener('mouseup', ()=>{ drag=null; });
  box.addEventListener('mouseleave', ()=>{ drag=null; });
  const r=$('#kl-range'); if(r) r.addEventListener('input', ()=>{ KL.show=+r.value; renderKline(); });
  const m=box.closest('.modal');
  if(m) m.querySelectorAll('[data-act="klpan"]').forEach(b=>{
    b.addEventListener('click', ()=>{ const n=KL.pts.length; const d=+b.dataset.d; const sh=Math.round(KL.show*0.3); KL.offset=Math.max(0, Math.min(n-KL.show, KL.offset+(d>0?-sh:sh))); renderKline(); });
  });
  const res=await fetchKline(cls, key);
  if(res.ok){
    KL.pts=res.pts; KL.mode=res.mode;
    const last=res.pts[res.pts.length-1], first=res.pts[0];
    const chg=first.c? (last.c-first.c)/first.c*100 : 0;
    const info=$('#kl-info');
    if(info) info.innerHTML=`<b>${esc(res.sym||title)}</b> · 最新 ${num(last.c, last.c<10?4:2)} · 区间涨跌 <span style="color:${upColor(chg)}">${pct(chg)}</span> · 源 ${esc(res.src)} · ${res.pts.length} 根`;
    DB.markets.kcache[cls+':'+key]=res.pts.slice(-160);
    renderKline();
  }else{
    const info=$('#kl-info'); if(info) info.innerHTML='⚠️ 该品种暂无可用的实时或缓存走势（股指 / 大宗需先导入每日简报；加密 / 外汇需联网）。';
    box.innerHTML='';
  }
}

function fearRing(v){
  const pctv=Math.max(0,Math.min(100,v));
  const rr=26, C=2*Math.PI*rr, off=C*(1-pctv/100);
  const col = pctv>65?'#e0342a' : pctv>45?'#e08700' : pctv>25?'#1e5bbf' : '#0e9e63';
  const label = pctv>65?'极度恐慌' : pctv>45?'恐慌' : pctv>25?'中性偏谨慎' : '平稳';
  return `<svg width="84" height="84" viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="${rr}" fill="none" stroke="#eef2f7" stroke-width="8"/>
    <circle cx="42" cy="42" r="${rr}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 42 42)"/>
    <text x="42" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="${col}">${v}</text>
    <text x="42" y="56" text-anchor="middle" font-size="9" fill="#8b97a8">${label}</text>
  </svg>`;
}

function dateBar(dateStr, label){
  const today=todayStr();
  const ds = dateStr?String(dateStr).slice(0,10):'';
  const isToday = ds && ds===today;
  return `<span class="pill ${isToday?'today':'stale'}">${isToday?'今日':'历史'}</span>`
       + `<span class="db-d">${esc(ds||'示例数据')}</span>`
       + `<span class="db-n">${esc(isToday?('今日'+(label?label+' ':'')+'数据 · 简报注入'):('历史 / 示例（'+(ds||'无')+'）· 导入每日简报更新'))}</span>`;
}

function mktCard(mk, dateStr){
  if(!mk) return '';
  const secHtml=(mk.sectors||[]).map(s=>{
    const flow = s.flow==null?'<span style="color:var(--ink3)">—</span>'
      : (s.flow>0?`<span style="color:#0e9e63">+${s.flow}</span>`:`<span style="color:#e0342a">${s.flow}</span>`);
    const leaders=(s.leaders||[]).map(l=>`<span class="ld">${esc(l.n)} <i style="color:${upColor(l.chg)}">${pct(l.chg)}</i></span>`).join('');
    return `<div class="sec">
      <div class="sec-h"><span>${esc(s.n)}</span><span class="sec-chg ${cls(s.chg)}">${pct(s.chg)}</span></div>
      <div class="sec-flow">资金 ${flow}</div>
      <div class="sec-ld">${leaders}</div>
    </div>`;
  }).join('');
  const flowHtml = mk.flowVal!=null
    ? `<div class="mkt-flow"><span>${esc(mk.flowLabel||'资金流向')}</span><b style="color:${upColor(mk.flowVal)}">${mk.flowVal>0?'+':''}${mk.flowVal} ${esc(mk.flowUnit||'')}</b></div>`
    : `<div class="mkt-flow"><span>${esc(mk.flowLabel||'资金流向')}</span><b style="color:var(--ink3)">—</b></div>`;
  return `<div class="card mkt ${mk.focus?'focus':''}">
    <div class="card-hd"><h3>${I.chart}${esc(mk.name)}</h3>${mk.focus?'<span class="pill live">重点</span>':''}${dateStr?`<span class="mkt-date">${esc(dateStr.slice(0,10))}</span>`:''}</div>
    ${flowHtml}
    <div class="sec-list">${secHtml}</div>
    <div class="mkt-note">${esc(mk.note||'')}</div>
  </div>`;
}

      <button class="tab ${CURTAB==='market'?'on':''}" data-act="tab" data-v="market">${I.chart}全球盘面</button>
      <button class="tab ${CURTAB==='asia'?'on':''}" data-act="tab" data-v="asia">${I.globe}亚太板块</button>
      <button class="tab ${CURTAB==='europe'?'on':''}" data-act="tab" data-v="europe">${I.bolt}欧美板块</button>
      <button class="tab ${CURTAB==='news'?'on':''}"   data-act="tab" data-v="news">${I.radar}要闻雷达${cTodo?` (${cTodo})`:''}</button>
      <button class="tab ${CURTAB==='review'?'on':''}" data-act="tab" data-v="review">${I.book}每日复盘</button>
    </div>

    <div id="body">${CURTAB==='market'?viewMarket():CURTAB==='asia'?viewAsia():CURTAB==='europe'?viewEurope():CURTAB==='news'?viewNews():viewReview()}</div>

    <div class="foot">数据全部保存在本机浏览器（localStorage），不上传任何服务器<br>换设备或清缓存前，记得先导出备份</div>
  </div>

  <div class="tabbar"><div class="tabbar-in">
    <button class="tb ${CURTAB==='market'?'on':''}" data-act="tab" data-v="market"><span class="n">${I.chart}</span>盘面</button>
    <button class="tb ${CURTAB==='asia'?'on':''}" data-act="tab" data-v="asia"><span class="n">${I.globe}</span>亚太</button>
    <button class="tb ${CURTAB==='europe'?'on':''}" data-act="tab" data-v="europe"><span class="n">${I.bolt}</span>欧美</button>
    <button class="tb ${CURTAB==='news'?'on':''}"   data-act="tab" data-v="news"><span class="n">${I.radar}${cTodo?`<span class="bdg">${cTodo}</span>`:''}</span>要闻</button>
    <button class="tb ${CURTAB==='review'?'on':''}" data-act="tab" data-v="review"><span class="n">${I.book}</span>复盘</button>
  </div></div>`;

  renderSync();
  window._todo = items;

  const nt=$('#rvnote');
  if(nt){
    nt.addEventListener('input',()=>{
      const r=getReview(todayStr()); r.note=nt.value;
      clearTimeout(nt._t); nt._t=setTimeout(()=>{persist('rv');},450);
    });
  }
}

/* ===================================================================
   8. 弹窗
   =================================================================== */
function closeModal(){ $('#modal-root').innerHTML=''; }
function modal(title, bodyHtml, footHtml){
  /* 注意：这里不能给 .modal 加 stopPropagation，
     否则弹窗内所有按钮的点击都无法冒泡到 document 上的事件总线。
     关闭遮罩的判定改由事件总线里的 e.target===mask 完成。 */
  $('#modal-root').innerHTML = `<div class="mask" data-act="mask">
    <div class="modal">
      <div class="m-hd"><h3>${esc(title)}</h3><button class="x" data-act="mclose">${I.x}</button></div>
      <div class="m-bd">${bodyHtml}</div>
      ${footHtml?`<div class="m-ft">${footHtml}</div>`:''}
    </div></div>`;
}

    <div class="fld"><label>敏感度</label>

/* ===================================================================
   9. 备份 / 恢复 / 简报导入
   =================================================================== */
function doExport(){
  const pack={type:'gmdesk-backup', version:1, exportedAt:new Date().toISOString(), data:DB};
  const blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`金融盘面台备份_${todayStr()}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},600);
  DB.meta.nudged=nowTs(); persist('mt'); render();
  toast('备份已导出');
}

function doImport(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      let p; try{p=JSON.parse(rd.result);}catch(e){return toast('文件不是合法 JSON');}
      const d = p.data || p;
      if(!d || (!d.news && !d.reviews && !d.markets)) return toast('这不是盘面台的备份文件');
      const nOld=DB.news.length, rOld=DB.reviews.length;
      if(d.markets)  DB.markets  = d.markets;
      if(d.news)     DB.news     = d.news;            /* 不限条数 */
      if(d.reviews)  DB.reviews  = d.reviews;
      if(d.meta)     DB.meta     = Object.assign(DB.meta, d.meta);
      if(d.settings) DB.settings = Object.assign(DB.settings, d.settings);
      document.body.classList.toggle('inv', !!DB.settings.inv);
      persist(); render();
      toast(`已恢复：要闻 ${DB.news.length} 条（原 ${nOld}）· 复盘 ${DB.reviews.length} 天（原 ${rOld}）`, 3400);
    };
    rd.readAsText(f);
  };
  inp.click();
}

function applyBrief(j, silent){
  let ni=0,nc=0,nn=0,na=0,ne=0;
  if(Array.isArray(j.indices)&&j.indices.length){
    DB.markets.indices = j.indices.map(x=>({
      c:x.c||x.code||'', n:x.n||x.name||x.c||'', r:x.r||x.region||'其他',
      p:+x.p!=null?+x.p:+x.price, g:x.g!=null?+x.g:(x.pct!=null?+x.pct:null),
      s:Array.isArray(x.s)?x.s:null, d:x.d
    }));
    DB.markets.srcIdx=j.date||todayStr(); DB.markets.tIdx=nowTs(); ni=j.indices.length;
  }
  if(Array.isArray(j.commodities)&&j.commodities.length){
    DB.markets.commodities = j.commodities.map(x=>({
      c:x.c||x.code||'', n:x.n||x.name||x.c||'', u:x.u||x.unit||'',
      p:x.p!=null?+x.p:+x.price, g:x.g!=null?+x.g:(x.pct!=null?+x.pct:null),
      s:Array.isArray(x.s)?x.s:null, d:x.d
    }));
    DB.markets.srcCmd=j.date||todayStr(); DB.markets.tCmd=nowTs(); nc=j.commodities.length;
  }
  if(Array.isArray(j.news)&&j.news.length){
    const seen=new Set(DB.news.map(n=>n.title));
    j.news.forEach(x=>{
      const title=x.title||x.t; if(!title||seen.has(title)) return;
      DB.news.unshift({id:uid(), ts:x.ts?(typeof x.ts==='number'?x.ts:Date.parse(x.ts)||nowTs()):nowTs(),
        title, level:(['high','mid','low'].includes(x.level)?x.level:'mid'),
        tags:Array.isArray(x.tags)?x.tags:[], src:x.src||x.source||'简报', done:false});
      seen.add(title); nn++;
    });
  }
  if(j.summary && (j.summary.opps||j.summary.risks||j.summary.note)){
    const r=getReview(j.date||todayStr());
    (j.summary.opps||[]).forEach(t=>{ if(!r.opps.some(o=>o.t===t)) r.opps.push({id:uid(),t:String(t),done:false}); });
    (j.summary.risks||[]).forEach(t=>{ if(!r.risks.some(o=>o.t===t)) r.risks.push({id:uid(),t:String(t),done:false}); });
    if(j.summary.note && !r.note) r.note=String(j.summary.note);
  }
  if(j.cniFear!=null){ DB.markets.cniFear = +j.cniFear; }
  if(j.asia && typeof j.asia==='object'){
    for(const k of ['china','hk','jp','kr']){
      if(j.asia[k] && typeof j.asia[k]==='object'){ DB.markets.asia[k]=j.asia[k]; na++; }
    }
  }
  if(j.europe && typeof j.europe==='object'){
    for(const k of ['eu','us']){
      if(j.europe[k] && typeof j.europe[k]==='object'){ DB.markets.europe[k]=j.europe[k]; ne++; }
    }
  }
  if((na||ne) && j.date){ DB.markets.asia.date=j.date; DB.markets.europe.date=j.date; }
  DB.meta.lastBrief = j.date||todayStr();
  persist();
  if(!silent) closeModal();
  render();
  if(!silent) toast(`导入完成：股指 ${ni} · 大宗 ${nc} · 新要闻 ${nn}${na?` · 亚太 ${na}`:''}${ne?` · 欧美 ${ne}`:''}${j.cniFear!=null?' · 恐慌指数已更新':''}`, 3200);
  else if(ni||nc||nn||na||ne||j.cniFear!=null) toast(`已自动同步简报（${DB.meta.lastBrief}）：股指 ${ni} · 大宗 ${nc} · 要闻 ${nn}${na?` · 亚太 ${na}`:''}${ne?` · 欧美 ${ne}`:''}`, 2600);
  return {ni,nc,nn,na,ne};
}

function doBrief(){
  const raw=$('#f-json').value.trim();
  if(!raw) return toast('请先粘贴简报 JSON');
  let j; try{ j=JSON.parse(raw); }catch(e){ return toast('JSON 解析失败：'+e.message, 3200); }
  applyBrief(j, false);
}

/* 自动同步：定时任务把 brief.json 写到同源目录，页面打开即拉取，无需手动粘贴 */
async function fetchBrief(silent){
  const url = DB.settings.dataUrl || './brief.json';
  try{
    const r = await fetch(url, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if(!j || typeof j!=='object') throw new Error('格式异常');
    const res = applyBrief(j, true);
    SYNC.briefAt = nowTs(); renderSync();
    return res;
  }catch(e){
    if(!silent) toast('暂无可自动同步的简报（'+url+'）：'+(e.message||e), 3200);
    else console.warn('brief 自动同步跳过：', e.message||e);
    return null;
  }
}

/* ===================================================================
   10. 事件总线
   =================================================================== */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act;

  if(a==='mask'){ if(e.target===t) closeModal(); return; }
  if(a==='mclose'){ closeModal(); return; }
  if(a==='tab'){ go(t.dataset.v); return; }
  if(a==='kline'){ openKline(t.dataset.cls, t.dataset.key); return; }
  if(a==='refresh'){ refreshLive(false); return; }
  if(a==='sync'){ fetchBrief(false); return; }
  if(a==='export'){ doExport(); return; }
  if(a==='import'){ doImport(); return; }
  if(a==='brief'){ openBrief(); return; }
  if(a==='briefdo'){ doBrief(); return; }
  if(a==='settings'){ openSettings(); return; }

  if(a==='todo'){ const it=(window._todo||[])[+t.dataset.i]; if(it) it.fn(); return; }

  /* 要闻 */
  if(a==='nadd'){ openNews(); return; }
  if(a==='nf'){ DB.settings.newsFilter=t.dataset.v; persist('st'); render(); return; }
  if(a==='ntoggle'){ const n=DB.news.find(x=>x.id===t.dataset.id); if(n){n.done=!n.done;persist('nw');render();} return; }
  if(a==='ndel'){
    const n=DB.news.find(x=>x.id===t.dataset.id); if(!n) return;
    if(confirm('确定删除这条要闻？\n\n'+n.title)){ DB.news=DB.news.filter(x=>x.id!==n.id); persist('nw'); render(); toast('已删除'); }
    return;
  }
  if(a==='nsave'){
    const title=$('#f-title').value.trim(); if(!title) return toast('标题不能为空');
    const lv=$('#f-lv').querySelector('.on'); 
    DB.news.unshift({id:uid(), ts:nowTs(), title,
      level:lv?lv.dataset.v:'mid',
      tags:$('#f-tags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
      src:$('#f-src').value.trim(), done:false});
    persist('nw'); closeModal(); render(); toast('要闻已记录');
    return;
  }

  /* 复盘 */
  if(a==='radd'){ openRItem(t.dataset.t); return; }
  if(a==='rsave'){
    const v=$('#f-t').value.trim(); if(!v) return toast('内容不能为空');
    getReview(todayStr())[t.dataset.t].push({id:uid(),t:v,done:false});
    persist('rv'); closeModal(); render(); toast('已添加');
    return;
  }
  if(a==='rtog'||a==='rdel'){
    const key=t.dataset.t, id=t.dataset.id;
    for(const r of DB.reviews){
      const i=r[key].findIndex(x=>x.id===id);
      if(i>-1){ if(a==='rtog') r[key][i].done=!r[key][i].done; else r[key].splice(i,1); break; }
    }
    persist('rv'); render(); return;
  }

  /* 清空 */
  if(a==='clearseed'){
    if(!confirm('清空示例数据？\n\n将移除预置的示例要闻与示例复盘，你自己录入的内容会保留。')) return;
    const seedTitles=new Set(SEED_NEWS.map(n=>n.title));
    DB.news=DB.news.filter(n=>!seedTitles.has(n.title));
    const seedDates=new Set(SEED_REVIEWS.map(r=>r.date));
    DB.reviews=DB.reviews.filter(r=>!seedDates.has(r.date));
    DB.markets.indices=[]; DB.markets.commodities=[];
    DB.markets.srcIdx=''; DB.markets.srcCmd='';
    persist(); closeModal(); render(); toast('示例数据已清空');
    return;
  }
  if(a==='clearall'){
    if(!confirm('⚠️ 确定清空全部数据？\n\n盘面、要闻、复盘记录将全部删除，且无法找回。\n\n建议先点「导出备份」。')) return;
    if(!confirm('再次确认：真的要清空吗？\n\n这是最后一次确认。')) return;
    Object.values(K).forEach(k=>localStorage.removeItem(k));
    DB={markets:{indices:[],commodities:[],fx:[],crypto:[],
                 asia:JSON.parse(JSON.stringify(SEED.asia)), europe:JSON.parse(JSON.stringify(SEED.europe)),
                 cniFear:SEED.cniFear, kcache:{}}, news:[], reviews:[],
         meta:{lastBrief:null,seeded:false,nudged:0}, settings:{inv:false,autoRefresh:true,tab:'market',newsFilter:'all',dataUrl:'./brief.json'}};
    document.body.classList.remove('inv');
    persist(); closeModal(); render(); toast('已清空全部数据');
    return;
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ===================================================================
   11. 启动
   =================================================================== */
render();
refreshLive(true);
fetchBrief(true);   // 打开即自动同步定时任务写入的简报，无需手动粘贴
setInterval(()=>{ if(DB.settings.autoRefresh && document.visibilityState==='visible') refreshLive(true); }, 60000);
setInterval(()=>{ renderSync(); }, 30000);
setInterval(()=>{ if(document.visibilityState==='visible') fetchBrief(true); }, 30*60*1000);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && nowTs()-(DB.markets.tFx||0) > 120000) refreshLive(true);
});
</script>
