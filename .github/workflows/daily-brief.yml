name: 每日简报自动更新

on:
  schedule:
    - cron: '30 23 * * *'   # 北京时间 07:30
    - cron: '30 14 * * *'   # 北京时间 22:30
  workflow_dispatch:        # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成简报（实时刷新股指/大宗）
        run: node gen-brief.js

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add brief.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "自动更新简报 $(date +%F)"
            git push
          fi
